spring:
  config:
    # Load local development variables when running from the Backend directory.
    # Docker Compose still provides container environment variables in Docker.
    import: optional:file:.env[.properties]

  application:
    name: pos-system

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pos}?serverTimezone=Asia/Ho_Chi_Minh&connectionTimeZone=Asia/Ho_Chi_Minh
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  devtools:
    livereload:
      enabled: true

app:
  demo:
    seed:
      enabled: ${APP_DEMO_SEED_ENABLED:false}
    passwords:
      admin: ${APP_DEMO_PASSWORDS_ADMIN:}
      store-admin: ${APP_DEMO_PASSWORDS_STORE_ADMIN:}
      store-manager: ${APP_DEMO_PASSWORDS_STORE_MANAGER:}
      branch-manager: ${APP_DEMO_PASSWORDS_BRANCH_MANAGER:}
      branch-admin: ${APP_DEMO_PASSWORDS_BRANCH_ADMIN:}
      cashier: ${APP_DEMO_PASSWORDS_CASHIER:}
      customer: ${APP_DEMO_PASSWORDS_CUSTOMER:}
  jwt:
    secret: ${JWT_SECRET}
  frontend:
    reset-url: http://localhost:5173/auth/reset-password?token=
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:5173
        - https://zosh-pos.vercel.app
        - https://pos-sytem-bcs6.vercel.app

server:
  port: 5000

razorpay:
  api:
    key: ${RAZORPAY_API_KEY:}
    secret: ${RAZORPAY_API_SECRET:}

stripe:
  api:
    key: ${STRIPE_API_KEY:}

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql: TRACE
